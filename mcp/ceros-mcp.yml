candidate_tools:
- name: ceros_get_current_account
  rest:
  - getCurrentAccount
  method: GET
  path: /accounts/current-account
  description: Resolve the API key to its account name and accountResourceId.
  input_schema: {}
  readonly: true
- name: ceros_get_folder_tree
  rest:
  - getFolderTree
  method: GET
  path: /accounts/{accountResourceId}/folder-tree
  description: Return the folder hierarchy of an account, optionally expanded and depth-bounded.
  input_schema:
    accountResourceId:
      type: string
      required: true
    depth:
      type: integer
      default: 2
    folder:
      type: string
    expand:
      type: string
      enum_values:
      - experiences
      - members
  readonly: true
- name: ceros_list_folder_experiences
  rest:
  - listFolderExperiences
  method: GET
  path: /folder/{folderResourceId}/experiences
  description: List experiences directly inside a folder, with search, sort and paging.
  input_schema:
    folderResourceId:
      type: string
      required: true
    page:
      type: number
    pageSize:
      type: number
      max: 50
    search:
      type: string
    sort:
      type: string
      enum_values:
      - alphabetical_a_to_z
      - alphabetical_z_to_a
      - last_created
      - last_updated
      - last_published
  readonly: true
- name: ceros_get_embed_codes
  rest:
  - getEmbedCodes
  method: GET
  path: /experiences/{experienceResourceId}/embed-codes
  description: Return embed snippets and serving URLs for an experience.
  input_schema:
    experienceResourceId:
      type: string
      required: true
    isExport:
      type: boolean
      default: false
  readonly: true
notes:
- Every candidate tool is read-only; the current API version exposes no write operation.
- Auth would be a single account-scoped bearer API key with no scopes — an agent given the key inherits
  the whole account's read surface. That is the design problem to solve before any such server ships.
- No tool crosswalk artifact is emitted: a crosswalk binds published MCP tools (or GraphQL fields) to
    REST operations, and Ceros publishes neither.
