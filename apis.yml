aid: ceros
name: Ceros
description: >-
  Ceros is an experiential content platform used by marketing, design and agency teams to build
  interactive, no-code web content — microsites, landing pages, interactive reports, infographics,
  pitch decks and embeddable experiences — in a browser design studio and publish them to a CDN.
  Its developer surface is three separate things. A small read-only REST Public API at
  rest.ceros.com walks accounts, folders, experiences and embed codes behind a bearer API key,
  versioned by dated snapshots selected with the x-ceros-api-version header. A browser-side Flex
  Experience SDK, delivered as an ES module from the Ceros CDN, scripts a published experience at
  runtime — setting text, controlling media and states, toggling visibility and navigating pages.
  And a public oEmbed 1.0 endpoint on view.ceros.com, together with first-party connectors for
  Adobe Experience Manager, Contentful, Optimizely and WordPress, places an experience inside
  another platform. Ceros also operates MarkUp, its visual commenting and collaboration product.
