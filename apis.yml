apis:
- aid: ceros:ceros-public-api
  name: Ceros Public API
  description: >-
    Read-only REST API over a Ceros account's content graph. The current dated version
    (2026-05-28-09-00) exposes four operations — resolve the account from the API key, walk the
    folder tree, list the experiences in a folder, and fetch the embed snippets and serving URLs
    for an experience. Bearer API key auth; version pinned with the x-ceros-api-version header.
    Earlier versions (through 2026-02-25-12-00) additionally exposed page reads and writes.
  humanURL: https://developers.ceros.com/api/public/ceros-public-api
  baseURL: https://rest.ceros.com
