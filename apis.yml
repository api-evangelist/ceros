- aid: ceros:ceros-oembed-api
  name: Ceros oEmbed API
  description: >-
    Public, unauthenticated oEmbed 1.0 provider endpoint. Given the canonical URL of a published
    Ceros experience it returns the title, canonical URL, natural dimensions and responsive embed
    markup (an aspect-ratio wrapper, an iframe and the Ceros scroll-proxy script). This is the
    endpoint Ceros's own Contentful app calls to resolve a pasted experience URL.
  humanURL: https://github.com/ceros/ceros-contentful-app
  baseURL: https://view.ceros.com
