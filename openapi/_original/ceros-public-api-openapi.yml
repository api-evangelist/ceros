                                  primaryAliasSlug:
                                    description: Slug the experience is publicly served under, null when
                                      unpublished
                                    anyOf:
                                    - type: string
                                    - type: 'null'
                                  lastModifiedAt:
                                    description: When the experience was last edited, null when never
                                      edited
                                    anyOf:
                                    - description: ISO 8601 timestamp in UTC
                                      type: string
                                      format: date-time
                                    - type: 'null'
                                  lastModifiedByMemberResourceId:
                                    description: Resource identifier of the member who last edited the
                                      experience
                                    anyOf:
                                    - type: string
                                    - type: 'null'
                                  lastModifiedByMemberName:
                                    description: Display name of that member
                                    anyOf:
                                    - type: string
                                    - type: 'null'
                                  publishHistory:
