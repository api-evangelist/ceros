                                description: Legacy numeric identifier of the member who made the change
                              memberResourceId:
                                description: Resource identifier of the member who made the change
                                type: string
                              memberName:
                                description: Display name of the member, null when unavailable
                                anyOf:
                                - type: string
                                - type: 'null'
                              timestamp:
                                description: When the change was made
                                type: string
                                format: date-time
                            required:
                            - folderResourceId
                            - folderLegacyId
                            - memberLegacyId
                            - memberResourceId
                            - memberName
                            - timestamp
                            additionalProperties: false
                        legacyExperienceCount:
                          description: Number of Legacy experiences in the folder
                          type: number
                        flexExperienceCount:
                          description: Number of Flex experiences in the folder
                          type: number
                        experiences:
                          description: Experiences in this folder, present when `expand=experiences`
                          type: object
                          properties:
                            count:
                              description: Number of experiences in the folder
                              type: number
                            self:
                              description: URL listing the experiences of this folder
                              type: string
                            resources:
                              description: The experiences themselves, empty unless expanded
                              type: array
                              items:
                                type: object
                                properties:
                                  resourceType:
                                    type: string
                                    const: experience
                                  resourceId:
                                    description: Resource identifier of the experience
                                    type: string
                                  legacyId:
                                    description: Legacy numeric identifier of the experience
                                  name:
                                    description: Display name of the experience
                                    type: string
                                  slug:
                                    description: URL slug of the experience
                                    type: string
                                  folderSlug:
                                    description: Slug of the folder that directly contains the experience
                                    type: string
                                  status:
                                    description: Current lifecycle state of the experience
                                    type: string
                                    enum:
                                    - published
                                    - draft
                                    - deleted
                                    - unpublished
                                  thumbnailUrl:
                                    description: URL of the experience thumbnail, null when none has been
                                      generated
                                    anyOf:
                                    - type: string
                                    - type: 'null'
                                  isFlexExperience:
                                    description: Whether this is a Flex experience rather than a Legacy
                                      one
                                    type: boolean
                                  partner:
                                    description: Partner the experience belongs to, null when not partner-owned
                                    anyOf:
                                    - type: string
