  /accounts/current-account:
    get:
      summary: Get current account
      description: Returns the name and resource ID of the account associated with the API key used to
        authenticate the request. Use this to discover the `accountResourceId` required by the account-scoped
        endpoints. Responds 401 when the API key is missing or invalid.
      tags:
      - accounts
      parameters: []
      operationId: getCurrentAccount
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  accountName:
                    description: Display name of the account
                    type: string
                  accountResourceId:
                    description: Resource identifier of the account, used to scope other requests
                    type: string
                required:
                - accountName
                - accountResourceId
                additionalProperties: false
