  /experiences/{experienceResourceId}/embed-codes:
    get:
      summary: Get experience embed codes
      description: 'Returns the embed snippets for an experience together with the URLs it is served from.
        Which snippets are returned depends on the experience: Flex experiences always return full-height,
        scrollable, and inline snippets, and are available before publishing; Legacy experiences must
        be published and return only the snippet variants their layout supports. Responds 404 when the
        experience is deleted, unpublished, or (Legacy only) has never been published.'
      tags:
      - embedCodes
      parameters:
      - name: experienceResourceId
        in: path
        description: Resource identifier of the experience
        required: true
        schema:
          type: string
      - name: isExport
        in: query
        description: Rewrite `viewUrl` and `assetBaseUrl` as paths relative to a self-hosted HTML export
          instead of hosted URLs. Legacy experiences only
        required: true
        content:
          application/json:
            schema:
              default: false
              type: boolean
      operationId: getEmbedCodes
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  viewUrl:
                    description: URL the experience is served from, or a path relative to the export root
                      when `isExport` is set
                    type: string
                  assetBaseUrl:
                    description: Base URL the experience loads its published assets from, or a path relative
                      to the export root when `isExport` is set
                    type: string
                  title:
                    description: Title of the experience
                    type: string
                  experienceAlias:
                    description: Legacy experience alias, empty string for Flex experiences
                    type: string
                  isPageOverHeightHomogeneous:
                    description: Whether every page shares the same over-height setting, always false
                      for Flex experiences
                    type: boolean
                  fullHeightEmbedCode:
                    description: Embed snippet sized to the full height of each page, absent when the
                      layout cannot support it
                    type: string
                  scrollableEmbedCode:
                    description: Embed snippet that scrolls over-height pages inside a fixed-aspect container,
                      absent when the layout cannot support it
                    type: string
                  inlineEmbedCode:
                    description: Embed snippet that renders the experience inline in the host page, Flex
                      experiences only
                    type: string
                required:
                - viewUrl
                - assetBaseUrl
                - title
                - experienceAlias
                - isPageOverHeightHomogeneous
                additionalProperties: false
        '400':
          description: '400'
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  errors:
                    description: One entry per problem encountered while handling the request
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          description: Human-readable explanation of the error
                          type: string
                        cause:
                          description: Per-field validation failures, when the error is a validation error
                          type: array
                          items:
                            type: object
                            properties:
                              code:
                                description: Machine-readable validation code
                                type: string
                              expected:
                                description: Value or type the field expected
                                type: string
                              message:
                                description: Human-readable explanation for this field
                                type: string
                              path:
                                description: Property path to the offending field, outermost segment first
                                type: array
                                items:
                                  type: string
                              received:
                                description: Value the field actually received
                                type: string
                            required:
                            - code
                            - expected
                            - message
                            - path
                            - received
                            additionalProperties: false
                      required:
                      - message
                      additionalProperties: false
                required:
                - errors
                additionalProperties: false
      security:
      - bearerAuth: []
  /folder/{folderResourceId}/experiences:
    get:
      summary: List folder experiences
      description: Returns a page of the experiences directly inside a folder, alongside the paging metadata
        needed to walk the rest of the result set. Sub-folders are not traversed. Results can be narrowed
        with `search` and ordered with `sort`. Responds 400 when `sort` is not one of the supported values,
        and 404 when the folder does not exist or the caller cannot list its experiences.
      tags:
      - experience
      parameters:
      - name: folderResourceId
        in: path
        description: Resource identifier of the folder
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: Page of results to return, 1-based. Defaults to 1
        content:
          application/json:
            schema:
              type: number
      - name: pageSize
        in: query
        description: Results per page, capped at 50. Defaults to 50
        content:
          application/json:
            schema:
              type: number
      - name: search
        in: query
        description: Filter experiences by name
        content:
          application/json:
            schema:
              type: string
      - name: sort
        in: query
        description: 'Ordering of results: `alphabetical_a_to_z`, `alphabetical_z_to_a`, `last_created`,
          `last_updated`, or `last_published`. Defaults to `last_created`'
        content:
          application/json:
            schema:
              type: string
      operationId: listFolderExperiences
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                TypeId: b95dff99-c744-469c-8065-5894c9941038
                type: object
                properties:
                  self:
                    description: Canonical URL of this page of results
                    type: string
                  resourceType:
                    description: Type of resource contained in `data`
                    type: string
                  paging:
                    description: Pagination cursor and totals for this result set
                    type: object
                    properties:
                      total:
                        description: Total number of matching resources
                        type: number
                      page:
                        description: Current page number, 1-based
                        type: number
                      pages:
                        description: Total number of pages available
                        type: number
                      pageSize:
                        description: Maximum resources returned per page
                        type: number
                      previous:
                        description: URL of the previous page, absent on the first page
                        type: string
                      next:
                        description: URL of the next page, absent on the last page
                        type: string
                    required:
                    - total
                    - page
                    - pages
                    - pageSize
                    additionalProperties: false
                  data:
                    description: Resources on the current page
                    type: array
                    items:
                      type: object
                      properties:
                        legacyId:
                          description: Legacy numeric identifier of the experience
                        name:
                          description: Display name of the experience
                          type: string
                        slug:
                          description: URL slug of the experience
                          type: string
                        resourceId:
                          description: Resource identifier of the experience
                          type: string
                        experienceAlias:
                          description: Primary alias slug the experience is addressed by
                          type: string
                        folderResourceId:
                          description: Resource identifier of the folder containing the experience
                          type: string
                        createdAt:
                          description: When the experience was created
                          type: string
                          format: date-time
                        status:
                          description: Current lifecycle state of the experience
                          type: string
                          enum:
                          - published
                          - draft
                          - deleted
                          - unpublished
                        lastModifiedAt:
                          description: When the experience was last edited
                          type: string
                          format: date-time
                        firstPublishedAt:
                          description: When the experience was first published
                          type: string
                          format: date-time
                        lastPublishedAt:
                          description: When the experience was most recently published
                          type: string
                          format: date-time
                        isFlexExperience:
                          description: Whether this is a Flex experience rather than a Legacy one
                          type: boolean
                        isPasswordProtected:
                          description: Whether viewers must enter a password to open the experience
                          type: boolean
                        isSSOProtected:
                          description: Whether viewers must sign in through SSO to open the experience
                          type: boolean
                        isTemplate:
                          description: Whether the experience is a template rather than a live one
                          type: boolean
                        thumbnailUrl:
                          description: URL of the first-page thumbnail
                          type: string
                        createdByMemberId:
                          description: Legacy numeric identifier of the member who created the experience,
                            0 when unknown
                          type: number
                        templateThumbnailUrl:
                          description: URL of the template preview image, null when not a template
                          anyOf:
                          - type: string
                          - type: 'null'
                        importLinkShared:
                          description: Whether the experience can be imported by other accounts via link
                          type: boolean
                        isShowcaseExperience:
                          description: Whether the experience is featured in the showcase
                          type: boolean
                        partner:
                          description: Partner the experience belongs to, null when not partner-owned
                          anyOf:
                          - type: string
                          - type: 'null'
                        partnerResourceId:
                          description: Location of the experience at the partner, null when not linked
                          anyOf:
                          - type: object
                            properties:
                              resourceId:
                                description: Identifier of the resource at the partner
                                type: string
                              tenant:
                                description: Partner tenant the resource lives in
                                type: string
                              teamsiteId:
                                description: Partner team site the resource belongs to
                                type: string
                            required:
                            - resourceId
                            - tenant
                            additionalProperties: false
                          - type: 'null'
                        wipDocVersion:
                          description: The in-progress draft version, absent when none is loaded
                          type: object
                          properties:
                            adminEditable:
                              description: Whether internal admins may edit the draft
                              type: boolean
                            textComponentType:
                              description: Text engine the draft was authored with
                              type: string
                              enum:
                              - old_text
                              - text_plus
                            editorPublishingDisabled:
                              description: Whether publishing from the editor is blocked for this draft
                              type: boolean
                          required:
                          - adminEditable
                          - textComponentType
                          - editorPublishingDisabled
                          additionalProperties: false
                        publishedDocVersion:
                          description: The currently published version, absent when unpublished
                          type: object
                          properties:
                            slug:
                              description: Slug of the published version
                              type: string
                          required:
                          - slug
                          additionalProperties: false
                        updatedBy:
                          description: Recent edits to the experience and who made them
                          type: array
                          items:
                            type: object
                            properties:
                              memberId:
                                description: Legacy numeric identifier of the member who made the change
                                type: number
                              memberName:
                                description: Display name of that member, empty when unavailable
                                type: string
                              timestamp:
                                description: When the change was made
                                type: string
                            required:
                            - memberId
                            - memberName
                            - timestamp
                            additionalProperties: false
                        publishHistory:
                          description: Publish-state changes recorded for the experience
                          type: array
                          items:
                            type: object
                            properties:
                              memberId:
                                description: Legacy numeric identifier of the member who changed the publish
                                  state
                                type: number
                              memberName:
                                description: Display name of that member, empty when unavailable
                                type: string
                              status:
                                description: Publish state the experience moved to
                                type: string
                                enum:
                                - published
                                - unpublished
                              timestamp:
                                description: When the publish state changed
                                type: string
                            required:
                            - memberId
                            - memberName
                            - status
                            - timestamp
                            additionalProperties: false
                      required:
                      - legacyId
                      - resourceId
                      - experienceAlias
                      - folderResourceId
                      - createdAt
                      - status
                      - isFlexExperience
                      - isPasswordProtected
                      - isSSOProtected
                      - isTemplate
                      - createdByMemberId
                      - templateThumbnailUrl
                      - importLinkShared
                      - isShowcaseExperience
                      - partner
                      - partnerResourceId
                      - updatedBy
                      - publishHistory
                      additionalProperties: false
                required:
                - self
                - resourceType
                - paging
                - data
                additionalProperties: false
        '400':
          description: '400'
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  errors:
                    description: One entry per problem encountered while handling the request
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          description: Human-readable explanation of the error
                          type: string
                        cause:
                          description: Per-field validation failures, when the error is a validation error
                          type: array
                          items:
                            type: object
                            properties:
                              code:
                                description: Machine-readable validation code
                                type: string
                              expected:
                                description: Value or type the field expected
                                type: string
                              message:
                                description: Human-readable explanation for this field
                                type: string
                              path:
                                description: Property path to the offending field, outermost segment first
                                type: array
                                items:
                                  type: string
                              received:
                                description: Value the field actually received
                                type: string
                            required:
                            - code
                            - expected
                            - message
                            - path
                            - received
                            additionalProperties: false
                      required:
                      - message
                      additionalProperties: false
                required:
                - errors
                additionalProperties: false
        '401':
          description: '401'
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  message:
                    description: Human-readable explanation of the error
                    type: string
                required:
                - message
                additionalProperties: false
        '403':
