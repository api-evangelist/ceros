                            additionalProperties: false
                        thumbnails:
                          description: Up to four preview thumbnails for the folder, keyed by `experience-<slug>`
                          type: object
                          propertyNames:
                            type: string
                          additionalProperties:
                            type: object
                            properties:
                              url:
