  /accounts/{accountResourceId}/folder-tree:
    get:
      summary: Get account folder tree
      description: Returns the folder hierarchy of an account as nested `children`, limited to the folders
        the caller can access. `depth` bounds how many levels are returned (2 by default) and `folder`
        restricts the result to one branch. Experiences and member counts are expensive and excluded by
        default — request them with `expand=experiences,members`. Responds 404 when the account does not
        exist or the caller has no access to it.
      tags:
      - folders
      parameters:
      - name: accountResourceId
        in: path
        description: Resource identifier of the account
        required: true
        schema:
          type: string
      - name: expand
        in: query
        description: 'Comma-separated related data to inline. Supported values: `experiences`, `members`'
        content:
          application/json:
            schema:
              type: string
      - name: folder
        in: query
        description: Resource identifier of a folder to restrict the tree to. Returns that folder and
          its descendants, plus its ancestors for structure only
        content:
          application/json:
            schema:
              type: string
      - name: depth
        in: query
        description: Maximum number of folder levels to return below the root. Set to 0 to return all
          levels.
        required: true
        content:
          application/json:
            schema:
              default: 2
              type: integer
              minimum: 0
              maximum: 9007199254740991
      operationId: getFolderTree
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                TypeId: a4dd4ec6-7f20-4917-bd9b-b2057a5caae9
                type: object
                properties:
                  resources:
                    description: Root folders of the tree, each nesting its children
                    type: array
                    items:
                      type: object
                      properties:
                        self:
                          description: Canonical URL of this folder
                          type: string
                        resourceType:
                          type: string
                          const: folder
                        resourceId:
                          description: Resource identifier of the folder
                          type: string
                        legacyId:
                          description: Legacy numeric identifier of the folder
                        accountLegacyId:
                          description: Legacy numeric identifier of the owning account
                        accountResourceId:
                          description: Resource identifier of the owning account
                          type: string
                        accountSlug:
                          description: URL slug of the owning account
                          type: string
                        createdByMemberId:
                          description: Legacy numeric identifier of the member who created the folder
                        createdByMemberName:
                          description: Display name of that member, null when unavailable
                          anyOf:
                          - type: string
                          - type: 'null'
                        createdAt:
                          description: When the folder was created
                          type: string
                          format: date-time
                        deletedAt:
                          description: When the folder was deleted, null while it is live
                          anyOf:
                          - description: ISO 8601 timestamp in UTC
                            type: string
                            format: date-time
                          - type: 'null'
                        parentResourceId:
                          description: Resource identifier of the parent folder, null at the root
                          anyOf:
                          - type: string
                          - type: 'null'
                        parentLegacyId:
                          description: Legacy numeric identifier of the parent folder, null at the root
                        parentSlug:
                          description: URL slug of the parent folder, null at the root
                          anyOf:
                          - type: string
                          - type: 'null'
                        parentName:
                          description: Display name of the parent folder, null at the root
                          anyOf:
                          - type: string
                          - type: 'null'
                        isAncestorDeleted:
                          description: Whether any folder above this one has been deleted
                          type: boolean
                        lastModifiedByMemberId:
                          description: Legacy numeric identifier of the member who last changed the folder
                        lastModifiedByMemberName:
                          description: Display name of that member, null when unavailable
                          anyOf:
                          - type: string
                          - type: 'null'
                        lastModifiedAt:
                          description: When the folder was last changed
                          type: string
                          format: date-time
                        slug:
                          description: URL slug of the folder
                          type: string
                        status:
                          description: Current lifecycle state of the folder
                          type: string
                        thumbnailUrl:
                          description: URL of the folder thumbnail, null when none has been generated
                          anyOf:
                          - type: string
                          - type: 'null'
                        name:
                          description: Display name of the folder
                          type: string
                        isFlexFolder:
                          description: Whether the folder holds Flex experiences rather than Legacy ones
