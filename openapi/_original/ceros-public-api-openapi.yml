                        ancestors:
                          description: Folders containing this one, outermost first
                          type: array
                          items:
                            type: object
                            properties:
                              resourceId:
                                description: Resource identifier of the ancestor folder
                                type: string
                              legacyId:
                                description: Legacy numeric identifier of the ancestor folder
                              name:
                                description: Display name of the ancestor folder
                                type: string
                              slug:
                                description: URL slug of the ancestor folder
                                type: string
                            required:
                            - resourceId
