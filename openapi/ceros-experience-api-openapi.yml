        '404':
          description: '404'
          content:
            application/json:
              schema:
                $schema: https://json-schema.org/draft/2020-12/schema
                type: object
                properties:
                  message:
                    type: string
                required:
                - message
                additionalProperties: false
      description: listFolderExperiences
      security:
