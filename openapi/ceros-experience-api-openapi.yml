        in: path
        required: true
        schema:
          type: string
      - name: page
        in: query
        content:
          application/json:
            schema:
              type: number
      - name: pageSize
        in: query
        content:
          application/json:
            schema:
              type: number
      - name: search
        in: query
        content:
          application/json:
            schema:
              type: string
      - name: sort
        in: query
        content:
          application/json:
            schema:
              type: string
      - name: offset
        in: query
        content:
          application/json:
            schema:
              type: number
      operationId: listFolderExperiences
