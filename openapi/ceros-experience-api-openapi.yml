                    items:
                      type: object
                      properties:
                        legacyId: {}
                        name:
                          type: string
                        slug:
                          type: string
                        resourceId:
                          type: string
                        experienceAlias:
                          type: string
                        folderResourceId:
                          type: string
                        creationDate:
                          type: string
                          format: date-time
                          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                        status:
                          type: string
                          enum:
                          - published
                          - draft
                          - deleted
                          - unpublished
                        lastModifiedDate:
                          type: string
                          format: date-time
                          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                        firstPublishedDate:
                          type: string
                          format: date-time
                          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                        lastPublishedDate:
                          type: string
                          format: date-time
                          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                        isFlexExperience:
                          type: boolean
                        isPasswordProtected:
                          type: boolean
                        isSSOProtected:
                          type: boolean
                        isTemplate:
                          type: boolean
                        thumbnailUrl:
                          type: string
                        createdByMemberId:
                          type: number
                        templateThumbnailUrl:
                          anyOf:
                          - type: string
                          - type: 'null'
                        importLinkShared:
                          type: boolean
                        isShowcaseExperience:
                          type: boolean
                        partner:
                          anyOf:
                          - type: string
                          - type: 'null'
                        partnerResourceId:
                          anyOf:
                          - type: object
                            properties:
                              resourceId:
                                type: string
                              tenant:
                                type: string
                              teamsiteId:
                                type: string
                            required:
                            - resourceId
                            - tenant
                            additionalProperties: false
                          - type: 'null'
                        wipDocVersion:
                          type: object
                          properties:
                            adminEditable:
                              type: boolean
                            textComponentType:
                              type: string
                              enum:
                              - old_text
                              - text_plus
                            editorPublishingDisabled:
                              type: boolean
                          required:
                          - adminEditable
                          - textComponentType
                          - editorPublishingDisabled
                          additionalProperties: false
                        publishedDocVersion:
                          type: object
                          properties:
                            slug:
                              type: string
                          required:
                          - slug
                          additionalProperties: false
                        updatedBy:
                          type: array
                          items:
                            type: object
                            properties:
                              memberId:
                                type: number
                              memberName:
                                type: string
                              timestamp:
                                type: string
                            required:
                            - memberId
                            - memberName
                            - timestamp
                            additionalProperties: false
                        publishHistory:
                          type: array
                          items:
                            type: object
                            properties:
                              memberId:
                                type: number
                              memberName:
                                type: string
                              status:
                                type: string
                                enum:
                                - published
                                - unpublished
                              timestamp:
                                type: string
                            required:
                            - memberId
                            - memberName
                            - status
                            - timestamp
                            additionalProperties: false
                      required:
                      - legacyId
                      - resourceId
                      - experienceAlias
                      - folderResourceId
                      - creationDate
                      - status
                      - isFlexExperience
                      - isPasswordProtected
                      - isSSOProtected
                      - isTemplate
                      - createdByMemberId
                      - templateThumbnailUrl
                      - importLinkShared
                      - isShowcaseExperience
                      - partner
                      - partnerResourceId
                      - updatedBy
                      - publishHistory
