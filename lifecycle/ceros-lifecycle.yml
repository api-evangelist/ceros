  note: >-
    Ceros publishes no deprecation policy, no sunset timeline and no support window for older
    dated versions, and neither the Deprecation nor the Sunset header (RFC 8594) is mentioned.
    Its stated position is that it does not deprecate — it versions.
  observed_surface_contraction:
    finding: >-
      The current version 2026-05-28-09-00 exposes 4 read-only GET operations. The immediately
      previous version 2026-02-25-12-00 exposed 11, including every write: createPage, deletePage,
      duplicatePage, batchUpdatePage, applyPageTemplate, plus getAllExperiencePages and
      getCmlForSelector. Those seven operations have no page in the current version's reference
      and their slugs 404 under the unversioned path.
    evidence:
    - url: https://developers.ceros.com/api/public/create-page
      status: 404
    - url: https://developers.ceros.com/api/public/get-all-experience-pages
      status: 404
    - url: https://developers.ceros.com/api/public/get-cml-for-selector
      status: 404
    - url: https://developers.ceros.com/api/public/2026-02-25-12-00/create-page
      status: 200
    interpretation: >-
      Read as published: the write surface was withdrawn from the current version without any
      deprecation notice, sunset date or migration note. Whether the endpoints still answer on
      rest.ceros.com under a pinned older version could not be tested without a key. This is
      exactly the case a deprecation policy exists to cover.
