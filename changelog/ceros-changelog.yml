  - version: 1.0.1
    date: '2026-07-01'
    fixed: [Brand kit fonts and colours now applied in the server-side Always Fetch, Store and HTML Import modes]
  - version: 1.0.0
    date: '2026-06-30'
    fixed: ['Deleting a Ceros Flex component no longer fails with "Paragraph delete operation failed"']
  - version: 0.0.8
    date: '2026-06-26'
    security:
    - >-
      Pasted experience URLs are no longer trusted by default. A manifest is fetched, and its
      scripts injected, only when served from a Ceros-owned domain (ceros.site by default);
      vanity domains are resolved via a new x-flex-manifest response header, and a spoofed header
      pointing off-Ceros is rejected.
    - New OSGi config cerosOwnedDomains and allowUntrustedManifestHost; production-safe defaults only.
    removed: [Unused mediaCdnBaseUrl OSGi property]
  - version: 0.0.7
    date: '2026-06-18'
    fixed: [HTML Import now uploads every file in the export archive, not only manifest-referenced assets]
  - version: 0.0.5
    date: '2026-06-17'
    added: [HTML-import delivery mode — upload a Ceros .tar.gz export and serve it fully offline from the DAM]
