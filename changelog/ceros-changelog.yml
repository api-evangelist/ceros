summary: >-
  Ceros publishes no dated changelog or release-notes page for its Public API. The only version
  history it exposes is the version selector on the API reference, which lists four dated
  snapshots and lets you diff them by reading each version's operation list. Its one genuinely
  dated, Keep-a-Changelog changelog is for the AEM connector, in that repository.
