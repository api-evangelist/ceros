summary: >-
  Ceros ships no server-side API client library for its Public REST API — there is no npm, PyPI,
  Maven, NuGet, Go, RubyGems, Packagist or crates.io client for rest.ceros.com. Everything it
  distributes is client-side or CMS-side: a browser ESM SDK for published Flex experiences, a
  release-candidate browser SDK for MarkUp commenting, and CMS connectors for AEM, Contentful and
  Optimizely.
